# Disable middle-mouse button on Elantech Touchpad only
# TrackPoint (physical button) remains functional
#
# Button mapping explanation:
# 1 1 3 = Physical buttons [left, middle, right] mapped to [left, left, right]
# This makes middle-click act as left-click, effectively disabling it

Section "InputClass"
    Identifier "Disable Touchpad Middle Click"
    MatchDriver "libinput"
    MatchIsTouchpad "on"
    MatchProduct "ETPS/2 Elantech Touchpad"
    Option "ButtonMapping" "1 1 3 4 5 6 7"
EndSection
