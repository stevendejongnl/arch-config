set-option -sa terminal-overrides ",xterm*:Tc"
set -g mouse on

# unbind C-b
# set -g prefix C-Space
# bind C-Space send-prefix

# Vim style pane selection
bind h select-pane -L
bind j select-pane -D 
bind k select-pane -U
bind l select-pane -R

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Use Alt-arrow keys without prefix key to switch panes
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Shift arrow to switch windows
bind -n S-Left  previous-window
bind -n S-Right next-window

# Shift Alt vim keys to switch windows
bind -n M-H previous-window
bind -n M-L next-window

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'dracula/tmux'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-processes 'ssh nvim vim htop btop tail less watch'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# https://draculatheme.com/tmux
# available plugins: battery, cpu-usage, git, gpu-usage, ram-usage, tmux-ram-usage, network, network-bandwidth, network-ping, ssh-session, attached-clients, network-vpn, weather, time, mpc, spotify-tui, kubernetes-context, synchronize-panes
# NOTE: playerctl handled by a custom segment below — dracula's version
# scroll-animates and flickers when combined with hide-when-empty.
set -g @dracula-plugins "time"
set -g @dracula-show-empty-plugins false

# available colors: white, gray, dark_gray, light_purple, dark_purple, cyan, green, orange, red, pink, yellow
set -g @dracula-time-colors "light_purple dark_gray"
set -g @dracula-time-format "%Y-%m-%d %H:%M"

# set vi-mode
set-window-option -g mode-keys vi

# keybindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

bind % split-window -v -c "#{pane_current_path}"
bind '"' split-window -h -c "#{pane_current_path}"

run '~/.tmux/plugins/tpm/tpm'

# custom "now playing" segment, appended after dracula builds the bar.
# Refreshed on tmux's status-interval; empty (invisible) unless a player is Playing.
set -g status-interval 5
set -ga status-right "#(~/.config/tmux/scripts/now-playing.sh)"

# Per-window colors — runs after TPM/Dracula so these take effect
# Set color: prefix + C opens menu, or: tmux set-window-option @wcolor '#ff5555'
# Clear color: select "None" in menu, or: tmux set-window-option @wcolor ''
set -g window-status-format "#[fg=#{?#{@wcolor},#{@wcolor},colour244}] #I:#W "
set -g window-status-current-format "#[fg=#{?#{@wcolor},#{@wcolor},colour255},bold] #I:#W "

bind-key C display-menu -T "#[align=centre]Window Color" \
  "Red"    r "set-window-option @wcolor '#ff5555'" \
  "Green"  g "set-window-option @wcolor '#50fa7b'" \
  "Yellow" y "set-window-option @wcolor '#f1fa8c'" \
  "Orange" o "set-window-option @wcolor '#ffb86c'" \
  "Purple" p "set-window-option @wcolor '#bd93f9'" \
  "Cyan"   c "set-window-option @wcolor '#8be9fd'" \
  "Pink"   i "set-window-option @wcolor '#ff79c6'" \
  "White"  w "set-window-option @wcolor '#f8f8f2'" \
  "None"   n "set-window-option @wcolor ''"
