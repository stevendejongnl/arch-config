set-option -sa terminal-overrides ",xterm*:Tc"
set -g mouse on

# unbind C-b
# set -g prefix C-Space
# bind C-Space send-prefix

# Vim style pane selection
bind h select-pane -L
bind j select-pane -D 
bind k select-pane -U
bind l select-pane -R

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Use Alt-arrow keys without prefix key to switch panes
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Shift arrow to switch windows
bind -n S-Left  previous-window
bind -n S-Right next-window

# Shift Alt vim keys to switch windows
bind -n M-H previous-window
bind -n M-L next-window

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-processes 'ssh nvim vim htop btop tail less watch'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Rime theme — https://git.madebysteven.nl/stevendejong/rime
set -g status on
set -g status-position bottom
set -g status-style "bg=#1a1d29,fg=#d3d6e6"
set -g status-left-length 30
set -g status-left "#[fg=#12141c,bg=#3ee6e0,bold] #S #[fg=#3ee6e0,bg=#1a1d29]"
set -g status-right-length 90
set -g status-right "#(~/.config/tmux/scripts/statusbar-right.sh)"
set -g window-status-current-style "bg=#20242f,fg=#3ee6e0,bold"
set -g window-status-style "fg=#7a7f99"
set -g pane-border-style "fg=#2a2f3d"
set -g pane-active-border-style "fg=#3ee6e0"
set -g message-style "bg=#3ee6e0,fg=#12141c"
set -g message-command-style "bg=#3ee6e0,fg=#12141c"

# set vi-mode
set-window-option -g mode-keys vi

# keybindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

bind % split-window -v -c "#{pane_current_path}"
bind '"' split-window -h -c "#{pane_current_path}"

set -g status-interval 5

run '~/.tmux/plugins/tpm/tpm'

# Per-window colors — runs after TPM/Dracula so these take effect
# Set color: prefix + C opens menu, or: tmux set-window-option @wcolor '#ff5555'
# Clear color: select "None" in menu, or: tmux set-window-option @wcolor ''
set -g window-status-format "#[fg=#{?#{@wcolor},#{@wcolor},#7a7f99}] #I:#W "
set -g window-status-current-format "#[fg=#{?#{@wcolor},#{@wcolor},#3ee6e0},bold] #I:#W "

bind-key C display-menu -T "#[align=centre]Window Color" \
  "Red"     r "set-window-option @wcolor '#ff5c78'" \
  "Green"   g "set-window-option @wcolor '#7fd88f'" \
  "Yellow"  y "set-window-option @wcolor '#ffd473'" \
  "Blue"    b "set-window-option @wcolor '#82aaff'" \
  "Purple"  p "set-window-option @wcolor '#9d7cd8'" \
  "Cyan"    c "set-window-option @wcolor '#3ee6e0'" \
  "Magenta" i "set-window-option @wcolor '#ff6ac1'" \
  "White"   w "set-window-option @wcolor '#d3d6e6'" \
  "None"    n "set-window-option @wcolor ''"
