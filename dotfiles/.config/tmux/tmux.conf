set-option -sa terminal-overrides ",xterm*:Tc"
set -g mouse on

# unbind C-b
# set -g prefix C-Space
# bind C-Space send-prefix

# Vim style pane selection
bind h select-pane -L
bind j select-pane -D 
bind k select-pane -U
bind l select-pane -R

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Use Alt-arrow keys without prefix key to switch panes
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Shift arrow to switch windows
bind -n S-Left  previous-window
bind -n S-Right next-window

# Shift Alt vim keys to switch windows
bind -n M-H previous-window
bind -n M-L next-window

# Ctrl+T opens a new window in the current pane's directory
bind -n C-t new-window -c "#{pane_current_path}"

# Alt+X closes the current window (Ctrl+X is left free for Claude Code chords)
bind -n M-x kill-window

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @sidepanel_toggle_key 'S'
set -g @sidepanel_focus_key 'F'
set -g @plugin 'stevendejongnl/tmux-sidepanel'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-open'

# Flat theme: light ink on near-black, colour only for status
set -g status on
set -g status-position bottom
set -g @sudo "#{==:#(~/.config/tmux/scripts/sudo-active.sh),1}"
set -g @accent "#{?#{E:@sudo},##f08f87,##ecebe6}"
set -g status-style "bg=#1c1d1f,fg=#ecebe6"
set -g status-left-length 40
set -g status-left "#[fg=#1c1d1f,bg=#{E:@accent},bold] #S #[fg=#{E:@accent},bg=#1c1d1f]#{E:@smark}"
set -g status-right-length 90
set -g status-right "#(~/.config/tmux/scripts/statusbar-right.sh)"
set -g window-status-current-style "fg=#ecebe6,bold"
set -g window-status-style "fg=#8b8c91"
set -g pane-border-style "fg=#{?#{E:@sudo},#4a2f2d,#34363a}"
set -g pane-active-border-style "fg=#{E:@accent}"
set -g message-style "bg=#{E:@accent},fg=#1c1d1f"
set -g message-command-style "bg=#{E:@accent},fg=#1c1d1f"

# set vi-mode
set-window-option -g mode-keys vi

# keybindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

bind % split-window -v -c "#{pane_current_path}"
bind '"' split-window -h -c "#{pane_current_path}"

set -g status-interval 2

# Tab name = closest git repo dir (falls back to cwd basename)
set -g automatic-rename on
set -g automatic-rename-format "#(~/.config/tmux/scripts/git-window-name.sh #{pane_current_path})"

# Agent state (herdr-style). Marks: ! blocked, + done, ~ working. Set by Claude Code hooks
# through scripts/agent-state.sh; rolled up per window (@wstate) and session (@sstate).
set -g @wmark "#{?#{==:#{@wstate},blocked},#[fg=#f08f87]!,#{?#{==:#{@wstate},done},#[fg=#9be3b4]+,#{?#{==:#{@wstate},working},#[fg=#f2c46d]~,}}}"
set -g @smark "#{?#{==:#{@sstate},blocked},#[fg=#f08f87 bg=#1c1d1f] !,#{?#{==:#{@sstate},done},#[fg=#9be3b4 bg=#1c1d1f] +,#{?#{==:#{@sstate},working},#[fg=#f2c46d bg=#1c1d1f] ~,}}}"
set-hook -g after-select-pane   'run-shell -b "~/.config/tmux/scripts/agent-state.sh seen #{pane_id} </dev/null"'
set-hook -g after-select-window 'run-shell -b "~/.config/tmux/scripts/agent-state.sh seen #{pane_id} </dev/null"'
set-hook -g client-session-changed 'run-shell -b "~/.config/tmux/scripts/agent-state.sh seen #{pane_id} </dev/null"'

run '~/.tmux/plugins/tpm/tpm'

# Per-window colors — runs after TPM/Dracula so these take effect
# Set color: prefix + C opens menu, or: tmux set-window-option @wcolor '#ff5555'
# Clear color: select "None" in menu, or: tmux set-window-option @wcolor ''
set -g window-status-format "#[fg=#{?#{@wcolor},#{@wcolor},#8b8c91}] #I:#W#{E:@wmark} "
set -g window-status-current-format "#[fg=#{?#{@wcolor},#{@wcolor},#ecebe6},bold] #I:#W#{E:@wmark} "

bind-key C display-menu -T "#[align=centre]Window Color" \
  "Red"     r "set-window-option @wcolor '#f08f87'" \
  "Green"   g "set-window-option @wcolor '#9be3b4'" \
  "Yellow"  y "set-window-option @wcolor '#f2c46d'" \
  "Blue"    b "set-window-option @wcolor '#8fb4f2'" \
  "Purple"  p "set-window-option @wcolor '#c3a6e8'" \
  "Cyan"    c "set-window-option @wcolor '#8cc9d6'" \
  "Magenta" i "set-window-option @wcolor '#d4bff0'" \
  "White"   w "set-window-option @wcolor '#ecebe6'" \
  "None"    n "set-window-option @wcolor ''"

# Agent sessions: prefix + A opens the session picker (worklog index, resume in a new window)
bind-key A display-popup -E -w 90% -h 70% -d "#{pane_current_path}" "~/.config/tmux/scripts/session-picker"
