# Rounded windows. The dwm border is part of the window, so the border is rounded too.
corner-radius = 6;
rounded-corners-exclude = [
	"class_g = 'Slock'",  # the lock screen covers everything, square and opaque
	"class_g = 'dwm'",  # the dwm bar
	"class_g = 'dwm-notch'",  # the notch is shaped by dwm, only its top corners are round
	"height = 30 && y = 0",  # the tray: picom sees it as the frame of its first icon, so the class does not match
	"window_type = 'dock'",
	"window_type = 'desktop'",
	"window_type = 'tooltip'",
	"window_type = 'menu'",
	"window_type = 'dropdown_menu'",
	"window_type = 'popup_menu'",
	"window_type = 'notification'",
	"class_g = 'Dunst'",
	"class_g = 'Rofi'",
	"_NET_WM_STATE *= '_NET_WM_STATE_FULLSCREEN'"
];

# The flat design has no window shadows. Only the active-monitor notch (dwm-notch) gets a soft one.
shadow = true;
shadow-radius = 10;
shadow-opacity = 0.7;
shadow-offset-x = -10;
shadow-offset-y = -10;
shadow-color = "#000000";
shadow-exclude = [ "!class_g = 'dwm-notch'" ];

fading = true;
fade-exclude = [ "class_g = 'Slock'" ];

fade-in-step = 0.03;

inactive-opacity = 1.0;
frame-opacity = 1.0;
active-opacity = 1.0;
opacity-rule = [
	"100:class_g = 'Slock'",  # the lock screen must hide every window behind it
	"100:class_g = 'Google-chrome'",
	"100:class_g = 'Chromium'",
	"100:class_g = 'Virt-manager'",
	"100:!focused",
	"100:focused"
];

backend = "glx";
vsync = true;

mark-wmwin-focused = true;
mark-ovredir-focused = true;

detect-client-opacity = true;
detect-transient = true;
detect-client-leader = true;

use-damage = true;
log-level = "warn";

wintypes:
{
  tooltip = { fade = true; shadow = true; opacity = 0.75; focus = true; full-shadow = false; };
  dock = { shadow = false; }
  dnd = { shadow = false; }
  popup_menu = { opacity = 0.98; }
  dropdown_menu = { opacity = 0.98; }
};
window-shader-fg-rule = [ "/home/stevendejong/.config/picom/tray.frag:height = 30 && y = 0 && width < 600" ];
