# Host configuration for computersloeber
# 'Work Laptop'

host: computersloeber
description: 'Work Laptop'

# Import shared configurations (optional)
# Example:
# import:
#   - hosts/shared/laptop-common.yaml

# Enabled modules
enabled_modules:
  - dwm
  - dark-mode
  - computer-sloeber
  - dotfiles              # Deploy dotfiles with stow symlinks
  - secrets               # Unlock and deploy encrypted secrets

# Host-specific packages
packages: []

# Exclude packages from base or modules
exclude:
  - wine-mono
  - texlive-doc
  - winetricks
  - wine-gecko
  - libreoffice-still
  - winegui
  - waydroid
  - caffeine-ng

# Settings
flatpak_scope: user           # "user" or "system"
auto_prune: false             # Auto-remove unmanaged packages during sync
module_processing: parallel   # "parallel" (default) or "sequential"
aur_helper: yay              # AUR helper to use (paru, yay, etc.)
editor: nvim                  # Editor for config files (falls back to $EDITOR)

# Config backups
config_backups:
  enabled: false         # Auto-backup configs before sync
  max_backups: 5        # Keep last N backups (0 = unlimited)

# System backups (Timeshift/Snapper)
system_backups:
  enabled: false         # Global toggle for system backups
  backup_on_sync: true  # Create backup during dcli sync
  backup_on_update: true # Create backup during dcli update
  tool: timeshift       # Backup tool: timeshift or snapper
  snapper_config: root  # Snapper config name (if using snapper)
  max_backups: 5        # Keep last N backups (0 = unlimited)

