# Intel AX200 (and similar Intel combo cards) intermittently fail to
# initialise with:
#     Bluetooth: hci0: Reading Intel version command failed (-110)
# when USB autosuspend is allowed to power the radio down. The controller
# then never registers with BlueZ (`bluetoothctl list` is empty, btmgmt
# reports 0 controllers) even though bluetooth.service is running.
#
# Disabling btusb autosuspend keeps the radio reachable across boots.
options btusb enable_autosuspend=0
