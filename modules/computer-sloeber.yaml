  - fprintd
  - fwupd
  - light                     # backlight
  - lact                      # AMD GPU control
  - openrgb
  - solaar                    # Logitech devices
  - powertop
  - smartmontools
  - lshw
  - evtest
  - android-udev
  - usbmuxd                   # iOS devices

