description: DWM

# List of packages in this module
packages:
  # build toolchain for the suckless repo (dwm/dmenu/slock)
  - base-devel
  - libx11
  - libxft
  - libxinerama
  # fonts dwm renders the bar with
  - ttf-jetbrains-mono-nerd
  - noto-fonts-emoji
  # statusbar script dependencies (.dwm/statusbar/*.sh)
  - jq              # harvest.sh
  - pamixer         # pipewire.sh
  - acpi            # battery.sh
  - pacman-contrib  # package-updates.sh (checkupdates)
  - bluez-utils     # bluetooth.sh (bluetoothctl)
  - libpulse        # pipewire.sh (pactl)
  - procps-ng       # cpu-usage.sh / memory-usage.sh (top, free)
  - xorg-xsetroot   # update-statusbar.sh

# Modules that conflict with this one
conflicts: []

# Script to run before installing packages (optional)
# Useful for system preparation like enabling multilib
pre_install_hook: "scripts/dwm.sh"

# Script to run after installing packages (optional)
post_install_hook: ""
